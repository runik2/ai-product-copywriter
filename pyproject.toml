[project]
name = "card-assistant"
version = "1.0.0"
description = "LLM-assisted B2B instrument card drafts without invented facts"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "pydantic>=2.7", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["card_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
card-assistant = "card_assistant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
